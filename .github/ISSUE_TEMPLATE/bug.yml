name: Bug report
description: A bug in USA MercWork, filed from a Discord report
labels: ["triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
      placeholder: |
        Expected:
        Actual:
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - PC
        - Mobile
        - Console
        - Tablet
    validations:
      required: true
  - type: input
    id: team
    attributes:
      label: Team/role in game
      placeholder: e.g. Law Enforcement, Patrol Officer
  - type: input
    id: discord
    attributes:
      label: Discord thread link
      placeholder: https://discord.com/channels/...
    validations:
      required: true
